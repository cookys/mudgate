<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mudgate docs</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0b0e;
      --panel: #12141a;
      --elevated: #1a1d27;
      --border: #2a2e3a;
      --text: #e8eaef;
      --dim: #8b93a7;
      --faint: #5c6478;
      --accent: #3dffa8;
      --accent-dim: rgba(61, 255, 168, 0.12);
      --font-ui: "DM Sans", "Noto Sans TC", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --sidebar-w: min(300px, 92vw);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
    }
    header {
      flex-shrink: 0;
      height: 48px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
    }
    header .brand {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--dim);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    header button, header a.btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--elevated);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    header button:hover, header a.btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .shell {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--panel);
      overflow: auto;
      padding: 10px 0 24px;
    }
    aside .group {
      margin: 12px 0 4px;
      padding: 0 12px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
    }
    aside a {
      display: block;
      padding: 7px 12px;
      color: var(--dim);
      text-decoration: none;
      font-size: 13px;
      border-left: 2px solid transparent;
    }
    aside a:hover { color: var(--text); background: var(--elevated); }
    aside a.active {
      color: var(--accent);
      background: var(--accent-dim);
      border-left-color: var(--accent);
    }
    aside a .path {
      display: block;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--faint);
      margin-top: 2px;
    }
    main {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 20px 22px 48px;
    }
    #content {
      max-width: 920px;
      margin: 0 auto;
      line-height: 1.65;
      font-size: 15px;
    }
    #content h1, #content h2, #content h3 {
      line-height: 1.3;
      font-weight: 600;
    }
    #content h1 { font-size: 1.75rem; margin-top: 0; }
    #content h2 {
      font-size: 1.25rem;
      margin-top: 1.6em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
    }
    #content h3 { font-size: 1.05rem; margin-top: 1.25em; color: var(--accent); }
    #content a { color: var(--accent); }
    #content code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--elevated);
      padding: 0.12em 0.35em;
      border-radius: 4px;
    }
    #content pre {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      overflow: auto;
    }
    #content pre code { background: none; padding: 0; }
    #content table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      display: block;
      overflow-x: auto;
      margin: 1em 0;
    }
    #content th, #content td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
    }
    #content th {
      background: var(--elevated);
      color: var(--dim);
      font-weight: 600;
      white-space: nowrap;
    }
    #content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    #content blockquote {
      margin: 1em 0;
      padding: 0.4em 0 0.4em 1em;
      border-left: 3px solid var(--accent);
      color: var(--dim);
    }
    #content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    #content li { margin: 0.25em 0; }
    .empty {
      color: var(--dim);
      text-align: center;
      padding: 4rem 1rem;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .error { color: #ff5c7a; }
    @media (max-width: 720px) {
      .shell { flex-direction: column; }
      aside {
        width: 100%;
        max-height: 38vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">mudgate docs</span>
    <h1 id="title">載入中…</h1>
    <button type="button" id="btn-menu" title="切換目錄">目錄</button>
    <a class="btn" id="btn-raw" href="#" target="_blank" rel="noopener">原始 .md</a>
  </header>
  <div class="shell">
    <aside id="nav"></aside>
    <main>
      <article id="content" class="empty">選擇左側文件</article>
    </main>
  </div>
  <script>
    const $nav = document.getElementById("nav");
    const $content = document.getElementById("content");
    const $title = document.getElementById("title");
    const $raw = document.getElementById("btn-raw");
    const $menu = document.getElementById("btn-menu");

    const PINNED = [
      { path: "research/zmud-feature-matrix.md", label: "★ zMUD 功能 Matrix" },
      { path: "plans/2026-07-21-rw-connect-protocols.md", label: "★ RW 連線 / MCCP plan" },
      { path: "design/terminal-fonts.md", label: "★ 終端字體 / TC chain" },
      { path: "plans/2026-07-21-i18n-locale.md", label: "★ i18n 語系 plan" },
      { path: "plans/2026-07-21-backlog-candidates.md", label: "★ Backlog 核對" },
      { path: "design/ui-spec.md", label: "UI Spec" },
      { path: "plans/2026-07-21-ui-shell-ship.md", label: "UI Shell SHIP" },
      { path: "architecture.md", label: "Architecture" },
      { path: "BACKLOG.md", label: "Backlog 全表" },
      { path: "research/rw-probe-2026-07-21.md", label: "RW Probe" },
      { path: "research/rw-ansi-and-map-controls.md", label: "RW ANSI / map_d" },
      { path: "projects/INDEX.md", label: "Projects INDEX" },
      { path: "plans/README.md", label: "Plans README" },
    ];

    marked.setOptions({ gfm: true, breaks: false });

    function groupOf(path) {
      const top = path.split("/")[0];
      return top || "root";
    }

    function renderNav(files) {
      const byGroup = {};
      const pinSet = new Set(PINNED.map((p) => p.path));
      $nav.innerHTML = "";

      const pinTitle = document.createElement("div");
      pinTitle.className = "group";
      pinTitle.textContent = "常用";
      $nav.appendChild(pinTitle);
      for (const p of PINNED) {
        if (!files.includes(p.path) && !files.some((f) => f.endsWith(p.path))) continue;
        const a = document.createElement("a");
        a.href = "#/" + p.path;
        a.dataset.path = p.path;
        a.innerHTML = p.label + '<span class="path">' + p.path + "</span>";
        $nav.appendChild(a);
      }

      for (const f of files) {
        if (pinSet.has(f)) continue;
        const g = groupOf(f);
        (byGroup[g] ||= []).push(f);
      }
      const order = ["plans", "design", "research", "projects", "adr", "security", "deploy", "reviews"];
      const groups = [
        ...order.filter((g) => byGroup[g]),
        ...Object.keys(byGroup).filter((g) => !order.includes(g)).sort(),
      ];
      for (const g of groups) {
        const t = document.createElement("div");
        t.className = "group";
        t.textContent = g;
        $nav.appendChild(t);
        for (const f of byGroup[g].sort()) {
          const a = document.createElement("a");
          a.href = "#/" + f;
          a.dataset.path = f;
          const name = f.split("/").pop();
          a.innerHTML = name + '<span class="path">' + f + "</span>";
          $nav.appendChild(a);
        }
      }
    }

    function setActive(path) {
      $nav.querySelectorAll("a").forEach((a) => {
        a.classList.toggle("active", a.dataset.path === path);
      });
    }

    async function loadDoc(path) {
      if (!path) {
        $title.textContent = "mudgate documentation";
        $content.className = "empty";
        $content.textContent = "從左側選一份 .md — 建議先看 ★ zMUD 功能 Matrix";
        $raw.href = "#";
        return;
      }
      $title.textContent = path;
      $raw.href = "/files/" + path;
      setActive(path);
      $content.className = "";
      $content.innerHTML = "<p class='empty'>載入 " + path + " …</p>";
      try {
        const res = await fetch("/files/" + path);
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const md = await res.text();
        $content.innerHTML = marked.parse(md);
        // fix relative links to other md
        $content.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href") || "";
          if (href.endsWith(".md") && !href.startsWith("http") && !href.startsWith("#")) {
            // resolve relative to current path
            try {
              const base = path.includes("/") ? path.replace(/\/[^/]+$/, "/") : "";
              let target = href.replace(/^\.\//, "");
              if (href.startsWith("../")) {
                const stack = path.split("/").slice(0, -1);
                const parts = href.split("/");
                for (const p of parts) {
                  if (p === "..") stack.pop();
                  else if (p !== ".") stack.push(p);
                }
                target = stack.join("/");
              } else if (!href.startsWith("/")) {
                target = base + target;
              }
              a.setAttribute("href", "#/" + target.replace(/^\/+/, ""));
            } catch (_) { /* leave */ }
          }
        });
        window.scrollTo(0, 0);
        document.querySelector("main").scrollTop = 0;
      } catch (e) {
        $content.className = "error";
        $content.textContent = "讀取失敗: " + e.message;
      }
    }

    function route() {
      const hash = location.hash.replace(/^#\/?/, "");
      loadDoc(decodeURIComponent(hash));
    }

    $menu.addEventListener("click", () => {
      const aside = document.getElementById("nav");
      aside.style.display = aside.style.display === "none" ? "" : "none";
    });

    fetch("/api/list")
      .then((r) => r.json())
      .then((files) => {
        renderNav(files);
        route();
      })
      .catch((e) => {
        $title.textContent = "無法載入目錄";
        $content.className = "error";
        $content.textContent = String(e);
      });

    window.addEventListener("hashchange", route);
  </script>
</body>
</html>
