# Example only — copy to docker-compose.yml and set secrets. Do not commit secrets.
services:
  proxy:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../..:/app
    command: sh -c "npm ci && npm run dev -w @mudgate/proxy"
    environment:
      MUDGATE_PROXY_MODE: remote-prod
      MUDGATE_AUTH_TOKEN: change-me
      MUDGATE_ORIGIN_ALLOWLIST: https://mud.example.com
      PORT: "17788"
    ports:
      - "17788:17788"
