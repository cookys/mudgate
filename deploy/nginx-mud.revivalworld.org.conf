# assmud site vhost — mud.revivalworld.org
# FreeBSD paths. Install (sudo):
#   cp deploy/nginx-mud.revivalworld.org.conf /usr/local/etc/nginx/assmud.conf
#   # ensure main nginx.conf http{} has:  include assmud.conf;
#   # OR replace default server block
#
# Certificate (acme.sh, cookys home):
#   ~/.acme.sh/mud.revivalworld.org_ecc/fullchain.cer
#   ~/.acme.sh/mud.revivalworld.org_ecc/mud.revivalworld.org.key
# Install to:
#   /usr/local/etc/ssl/assmud/fullchain.pem
#   /usr/local/etc/ssl/assmud/privkey.pem
#
# Policy: listen **443 only** (no :80 default welcome). Renew via
# DNS-01 or brief --standalone (stop nginx, issue, start).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Optional: refuse bare IP / other hostnames on 443
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /usr/local/etc/ssl/assmud/fullchain.pem;
    ssl_certificate_key /usr/local/etc/ssl/assmud/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    server_name mud.revivalworld.org;

    ssl_certificate     /usr/local/etc/ssl/assmud/fullchain.pem;
    ssl_certificate_key /usr/local/etc/ssl/assmud/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Static SPA (build into this dir; world-readable for www user)
    root /usr/local/www/assmud;
    index index.html;

    # security headers (SPA)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # assmud-proxy WebSocket only
    location = /ws {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # optional internal health via TLS (not required)
    location = /proxy-health {
        proxy_pass http://127.0.0.1:7788/health;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        deny all;
    }
}
