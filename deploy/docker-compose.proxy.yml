# assmud proxy — self-host defaults (loopback only).
# Front with Caddy/cloudflared on 443. Do not publish 7788 to the internet.
#
# Required env: ASSMUD_AUTH_TOKEN, ASSMUD_ORIGIN_ALLOWLIST
services:
  proxy:
    # Must be digest-pinned: ghcr.io/OWNER/assmud-proxy@sha256:<64hex>
    image: ${ASSMUD_PROXY_IMAGE:?set digest-pinned ASSMUD_PROXY_IMAGE}
    restart: unless-stopped
    environment:
      ASSMUD_PROXY_MODE: remote-prod
      ASSMUD_AUTH_TOKEN: ${ASSMUD_AUTH_TOKEN:?set token}
      ASSMUD_ORIGIN_ALLOWLIST: ${ASSMUD_ORIGIN_ALLOWLIST:?set origins}
      ASSMUD_BIND_HOST: ${ASSMUD_BIND_HOST:-127.0.0.1}
      PORT: "7788"
    network_mode: host
    # With network_mode host, bind 127.0.0.1:7788 on the host only.
