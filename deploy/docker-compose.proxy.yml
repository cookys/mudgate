# mudgate proxy — self-host defaults (loopback only).
# Front with Caddy/cloudflared on 443. Do not publish 7788 to the internet.
#
# Required env: MUDGATE_AUTH_TOKEN, MUDGATE_ORIGIN_ALLOWLIST
services:
  proxy:
    # Must be digest-pinned: ghcr.io/OWNER/mudgate-proxy@sha256:<64hex>
    image: ${MUDGATE_PROXY_IMAGE:?set digest-pinned MUDGATE_PROXY_IMAGE}
    restart: unless-stopped
    environment:
      MUDGATE_PROXY_MODE: remote-prod
      MUDGATE_AUTH_TOKEN: ${MUDGATE_AUTH_TOKEN:?set token}
      MUDGATE_ORIGIN_ALLOWLIST: ${MUDGATE_ORIGIN_ALLOWLIST:?set origins}
      MUDGATE_BIND_HOST: ${MUDGATE_BIND_HOST:-127.0.0.1}
      PORT: "7788"
    network_mode: host
    # With network_mode host, bind 127.0.0.1:7788 on the host only.
